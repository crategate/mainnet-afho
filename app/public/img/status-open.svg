<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <!-- Market Open — dim green candlesticks climbing, fading to black at the
       bottom so the tile's tint gradient stays in charge of the palette. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050807" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#050807" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#060a08"/>
  <g stroke="#0f4d38" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="300" x2="120" y2="380"/>
    <line x1="220" y1="260" x2="220" y2="345"/>
    <line x1="320" y1="225" x2="320" y2="310"/>
    <line x1="420" y1="185" x2="420" y2="270"/>
    <line x1="520" y1="140" x2="520" y2="230"/>
    <line x1="620" y1="95"  x2="620" y2="185"/>
  </g>
  <g fill="#125239" opacity="0.85">
    <rect x="98"  y="310" width="44" height="52" rx="3"/>
    <rect x="198" y="268" width="44" height="56" rx="3"/>
    <rect x="298" y="230" width="44" height="62" rx="3"/>
    <rect x="398" y="192" width="44" height="62" rx="3"/>
    <rect x="498" y="146" width="44" height="68" rx="3"/>
    <rect x="598" y="100" width="44" height="70" rx="3"/>
  </g>
  <g stroke="#1d7a56" stroke-width="7" stroke-linecap="round" opacity="0.7">
    <line x1="98"  y1="285" x2="142" y2="295"/>
    <line x1="198" y1="248" x2="242" y2="256"/>
    <line x1="298" y1="208" x2="342" y2="218"/>
    <line x1="398" y1="170" x2="442" y2="180"/>
    <line x1="498" y1="124" x2="542" y2="134"/>
    <line x1="598" y1="78"  x2="642" y2="88"/>
  </g>
  <polyline points="60,330 240,290 420,240 600,160 740,70" fill="none"
    stroke="#2aa06e" stroke-width="6" stroke-linecap="round"
    stroke-linejoin="round" opacity="0.55" stroke-dasharray="2 14"/>
  <rect width="800" height="500" fill="url(#fade)"/>
</svg>
