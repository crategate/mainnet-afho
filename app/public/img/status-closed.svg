    <line x1="70" y1="390" x2="105" y2="390"/>
    <line x1="260" y1="315" x2="305" y2="315"/>
    <line x1="260" y1="365" x2="305" y2="365"/>
    <line x1="455" y1="290" x2="495" y2="290"/>
    <line x1="650" y1="320" x2="700" y2="320"/>
