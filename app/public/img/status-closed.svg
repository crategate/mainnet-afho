      <stop offset="0" stop-color="#050607" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#050607" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#070809"/>
  <g fill="#101318">
    <rect x="50"  y="260" width="75"  height="240"/>
    <rect x="150" y="215" width="65"  height="285"/>
    <rect x="240" y="275" width="85"  height="225"/>
    <rect x="350" y="195" width="60"  height="305"/>
    <rect x="435" y="250" width="80"  height="250"/>
    <rect x="540" y="220" width="65"  height="280"/>
